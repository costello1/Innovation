name: Survey interaction tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx --yes firebase-tools@15.33.0 emulators:exec --only firestore,auth --project demo-innovation --config firebase.json "npm run test:e2e"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survey-test-results
          path: output/qa/
